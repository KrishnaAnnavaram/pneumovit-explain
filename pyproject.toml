[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pneumovit-explain"
version = "0.1.0"
description = "From-scratch ViT pneumonia detector with attention maps, similar cases and LLM explanations"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Krishna Annavaram" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.5",
    "pillow>=10.0",
    "joblib>=1.3",
]

[project.optional-dependencies]
deep = ["torch>=2.2", "timm>=1.0"]
app = ["streamlit>=1.35"]
faiss = ["faiss-cpu>=1.8"]
dev = ["pytest>=8"]

[project.scripts]
pneumovit-explain = "pneumovit_explain.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-p no:cacheprovider"
